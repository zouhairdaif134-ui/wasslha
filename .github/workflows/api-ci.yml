name: WASSLHA CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    paths:
      - "apps/**"
      - "supabase/migrations/**"
      - ".github/workflows/**"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  merchant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  rider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx expo config --type public
      - run: npx expo export --platform android --output-dir .expo-export

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx expo config --type public
      - run: npx expo export --platform android --output-dir .expo-export

  rider-mobile:
    name: Rider Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck

  customer-mobile:
    name: Customer Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
