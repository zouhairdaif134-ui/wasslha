name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: customer
        type: choice
        options:
          - customer
          - rider
      api_url:
        description: "API base URL (https://..., no trailing slash)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_url }}
      EXPO_PUBLIC_SUPABASE_URL: https://ehlbdmaqhelxiobskxqq.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVobGJkbWFxaGVseGlvYnNreHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNjc1NzAsImV4cCI6MjEwNjY0MzU3MH0.UfTgx1McSbVGr4dt_59OSxpzANy7fbz3NDfv41-0NFc
      GOOGLE_MAPS_ANDROID_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: apps/${{ inputs.app }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Publish APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ inputs.app }}-${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "wasslha-${{ inputs.app }}.apk"
          gh release create "$TAG" "wasslha-${{ inputs.app }}.apk" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "WASSLHA ${{ inputs.app }} APK #${{ github.run_number }}" \
            --notes "Android test build (${{ inputs.app }})."
